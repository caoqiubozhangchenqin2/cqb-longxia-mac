name: Height Assistant Tests

on:
  push:
    paths:
      - "apps/height-assistant/**"
      - ".github/workflows/height-assistant-tests.yml"
  pull_request:
    paths:
      - "apps/height-assistant/**"
      - ".github/workflows/height-assistant-tests.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/height-assistant
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/height-assistant/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
